spring.application.name=project
server.port=8080

# ============================================== DATABASE =============================================
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1
spring.datasource.username=project
spring.datasource.password=123
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ============================================= JPA / Hibernate =========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Optional: Explicit Oracle dialect (Hibernate usually detects it automatically)
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# ============================================== RAG / SPRING AI =========================================
# Enable after setting GEMINI_API_KEY and confirming that the configured Oracle user can create vector tables.
app.rag.enabled=${RAG_ENABLED:false}
app.rag.top-k=${RAG_TOP_K:5}
app.rag.max-recommendations=${RAG_MAX_RECOMMENDATIONS:3}
# Keep the application safe to start without a Gemini key. Set both to google-genai when RAG is enabled.
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.model.embedding.text=${SPRING_AI_MODEL_EMBEDDING_TEXT:none}
spring.ai.vectorstore.type=${SPRING_AI_VECTORSTORE_TYPE:none}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.embedding.api-key=${GEMINI_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_CHAT_MODEL:gemini-3.6-flash}
spring.ai.google.genai.embedding.text.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
spring.ai.google.genai.embedding.text.dimensions=${GEMINI_EMBEDDING_DIMENSIONS:768}
spring.ai.vectorstore.oracle.table-name=CREDPULSE_RAG_VECTORS
spring.ai.vectorstore.oracle.dimensions=${GEMINI_EMBEDDING_DIMENSIONS:768}
spring.ai.vectorstore.oracle.distance-type=COSINE
spring.ai.vectorstore.oracle.index-type=IVF
spring.ai.vectorstore.oracle.initialize-schema=true

